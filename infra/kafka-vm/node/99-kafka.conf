# Kernel settings recommended for Kafka brokers

# Avoid swapping the JVM; Kafka uses the OS page cache for data
vm.swappiness = 1

# Kafka memory-maps index files: 2 per segment, many partitions -> many maps.
# Ubuntu 24.04 already ships 1048576; Kafka needs at least 262144. Don't lower it.
vm.max_map_count = 1048576

# Flush dirty pages earlier and more smoothly
vm.dirty_background_ratio = 5
vm.dirty_ratio = 60

# Larger socket buffers for replication and client traffic
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
